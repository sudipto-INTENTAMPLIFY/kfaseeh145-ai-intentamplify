name: Staging Vercel Preview

on:
  push:
    branches:
      - agent/intent-amplify-staging
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout approved staging branch
        uses: actions/checkout@v4

      - name: Guard against non-staging branch
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "agent/intent-amplify-staging" || {
            echo "Refusing deployment from ${GITHUB_REF_NAME}" >&2
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Verify application build
        run: npm run build

      - name: Detect optional Vercel CLI credentials
        id: vercel-auth
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
            echo "Vercel CLI credentials available; explicit Preview deployment enabled."
          else
            echo "cli=false" >> "$GITHUB_OUTPUT"
            echo "Vercel CLI credentials are not configured."
            echo "Using the repository's existing Vercel Git integration for Preview deployment."
            echo "This is not an error and does not authorize production deployment."
          fi

      - name: Install Vercel CLI
        if: steps.vercel-auth.outputs.cli == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Preview configuration
        if: steps.vercel-auth.outputs.cli == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel Preview artifact
        if: steps.vercel-auth.outputs.cli == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Vercel Preview only
        if: steps.vercel-auth.outputs.cli == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          URL="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      - name: Record staging deployment summary
        shell: bash
        run: |
          {
            echo "## Intent Amplify staging deployment"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Mode: Vercel Preview (non-production)"
            if [ "${{ steps.vercel-auth.outputs.cli }}" = "true" ]; then
              echo "- Deployment path: Vercel CLI Preview"
              echo "- URL: ${{ steps.deploy.outputs.url }}"
            else
              echo "- Deployment path: existing Vercel Git integration"
              echo "- Git integration deployment is verified independently by Vercel/GitHub deployment status and rendered acceptance."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
